apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: streamingapp
  labels:
    app: auth-service
    version: "1.0"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/streamingapp/auth-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3001

        envFrom:
        - secretRef:
            name: streamingapp-secrets

        env:
        - name: PORT
          value: "3001"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 15

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: streamingapp

spec:
  selector:
    app: auth-service

  ports:
  - port: 3001
    targetPort: 3001

  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: auth-service-hpa
  namespace: streamingapp

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service

  minReplicas: 2
  maxReplicas: 6

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
