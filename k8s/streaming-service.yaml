apiVersion: apps/v1
kind: Deployment

metadata:
  name: streaming-service
  namespace: streamingapp
  labels:
    app: streaming-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: streaming-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: streaming-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: streaming-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/streamingapp/streaming-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3002

        envFrom:
        - secretRef:
            name: streamingapp-secrets

        env:
        - name: PORT
          value: "3002"

        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 20
          periodSeconds: 15

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: streaming-service
  namespace: streamingapp

spec:
  selector:
    app: streaming-service

  ports:
  - port: 3002
    targetPort: 3002

  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: streaming-service-hpa
  namespace: streamingapp

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streaming-service

  minReplicas: 2
  maxReplicas: 8

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
