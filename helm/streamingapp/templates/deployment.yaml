{{- if eq .Values.global.imageTag "latest" }}
{{- fail "global.imageTag must be a pinned version (git SHA), not latest" }}
{{- end }}
{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $svcName }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  {{- /* When an HPA owns the replica count, Helm must not reset it on every upgrade */}}
  {{- if not $svc.hpa }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      containers:
        - name: {{ $svcName }}
          image: "{{ required "global.imageRegistry must be set (--set global.imageRegistry=...)" $.Values.global.imageRegistry }}/{{ $svc.image.name }}:{{ required "global.imageTag must be a pinned version (git SHA), not latest" $.Values.global.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.service.port }}
          env:
            - name: PORT
              value: {{ $svc.service.port | quote }}
          envFrom:
            - secretRef:
                name: {{ $.Values.global.secretName }}
          {{- with $svc.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/api/health" }}
              port: {{ $svc.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/api/health" }}
              port: {{ $svc.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
{{- end }}
{{- end }}
