---
- name: Configure Jenkins CI Server
  hosts: tag_Role_jenkins
  become: true
  roles:
    - common
    - docker
    - kubectl
    - ci_tools
    - node_exporter # Sprint 5: Jenkins host metrics for Prometheus
    # Tagged so the Jenkins-run pipeline can skip it (--skip-tags jenkins):
    # Jenkins must never reinstall/restart itself from inside its own job
    - role: jenkins
      tags: [jenkins]

- name: Configure Application Nodes
  hosts: tag_Role_appnode
  become: true
  roles:
    - common
    - docker
