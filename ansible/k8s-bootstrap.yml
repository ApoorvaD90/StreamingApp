---
# Configures the EKS cluster itself: add-ons the app depends on, namespace and secret,
# and (Sprint 5) the monitoring stack: Prometheus, Alertmanager, Grafana, alert rules, dashboards.
# Runs on the Jenkins host (localhost) using its IAM role. Inputs come from env vars
# set by jenkins/Jenkinsfile.ansible (Terraform outputs + Jenkins credentials).
- name: Bootstrap EKS add-ons and application config
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    cluster_name: streamingapp-cluster
    region: us-east-1
    namespace: streamingapp
    vpc_id: "{{ lookup('env', 'VPC_ID') }}"
    lb_role_arn: "{{ lookup('env', 'LB_ROLE_ARN') }}"
    app_url: "{{ lookup('env', 'APP_PUBLIC_URL') }}"
    jenkins_private_ip: "{{ lookup('env', 'JENKINS_PRIVATE_IP') }}"
    monitoring_namespace: monitoring
    # Pinned chart versions so every run installs exactly the same release
    metrics_server_chart_version: "3.14.0"
    lb_controller_chart_version: "1.17.1" # controller v2.17; the IAM policy attached by Terraform targets v2
    kube_prometheus_stack_chart_version: "92.3.1" # Prometheus Operator v0.94.1, Grafana chart 13.5.1
  tasks:
    - name: Fail early if required inputs are missing
      assert:
        that:
          - vpc_id | length > 0
          - lb_role_arn | length > 0
          - lookup('env', 'JWT_SECRET') | length > 0
          - jenkins_private_ip | length > 0
          - lookup('env', 'GRAFANA_ADMIN_PASSWORD') | length > 0
          - lookup('env', 'SLACK_WEBHOOK_URL') is match('https://hooks.slack.com/')
        fail_msg: "VPC_ID, LB_ROLE_ARN, JWT_SECRET, JENKINS_PRIVATE_IP, GRAFANA_ADMIN_PASSWORD and SLACK_WEBHOOK_URL (https://hooks.slack.com/...) must be set"

    - name: Write kubeconfig for the EKS cluster
      command: aws eks update-kubeconfig --name {{ cluster_name }} --region {{ region }}
      changed_when: false

    - name: Install metrics-server (required for HPA CPU metrics)
      kubernetes.core.helm:
        name: metrics-server
        chart_ref: metrics-server
        chart_version: "{{ metrics_server_chart_version }}"
        chart_repo_url: https://kubernetes-sigs.github.io/metrics-server/
        release_namespace: kube-system
        wait: true

    - name: Install AWS Load Balancer Controller (creates the ALB from the Ingress)
      kubernetes.core.helm:
        name: aws-load-balancer-controller
        chart_ref: aws-load-balancer-controller
        chart_version: "{{ lb_controller_chart_version }}"
        chart_repo_url: https://aws.github.io/eks-charts
        release_namespace: kube-system
        wait: true
        values:
          clusterName: "{{ cluster_name }}"
          region: "{{ region }}"
          vpcId: "{{ vpc_id }}"
          serviceAccount:
            create: true
            name: aws-load-balancer-controller
            annotations:
              eks.amazonaws.com/role-arn: "{{ lb_role_arn }}"

    - name: Create default gp3 StorageClass (EBS CSI) for persistent volumes
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/storageclass.yaml"

    - name: Create application namespace
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/namespace.yaml"

    # No AWS keys: the S3 client falls back to the node IAM role, which has the S3 policy
    - name: Create or refresh application secret
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: streamingapp-secrets
            namespace: "{{ namespace }}"
          type: Opaque
          # base64 'data' (not stringData) so the task reports 'changed' only when a value really changes
          data:
            JWT_SECRET: "{{ lookup('env', 'JWT_SECRET') | b64encode }}"
            MONGO_URI: "{{ 'mongodb://mongo-service:27017/streamingapp' | b64encode }}"
            AWS_REGION: "{{ region | b64encode }}"
            AWS_S3_BUCKET: "{{ lookup('env', 'S3_BUCKET') | b64encode }}"
            CLIENT_URLS: "{{ app_url | b64encode }}"
            STREAMING_PUBLIC_URL: "{{ app_url | b64encode }}"
      register: app_secret

    # Pods read the secret only at start-up (envFrom), so restart them when it changes
    # (e.g. CLIENT_URLS set once the ALB exists). No-op before the first app deploy.
    - name: Restart app deployments to pick up the changed secret
      command: kubectl rollout restart deployment -n {{ namespace }} -l chart
      when: app_secret.changed
      register: restart
      changed_when: "'restarted' in restart.stdout"
      failed_when: false

    # ---- Sprint 5: monitoring and alerting ------------------------------------------------
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ monitoring_namespace }}"

    # Values come from Jenkins credentials (grafana-admin-password, slack-webhook-url), never from code
    - name: Create Grafana admin and Alertmanager Slack secrets
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ monitoring_namespace }}"
          type: Opaque
          data: "{{ item.data }}"
      loop:
        - name: grafana-admin
          data:
            admin-user: "{{ 'admin' | b64encode }}"
            admin-password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | b64encode }}"
        - name: alertmanager-slack
          data:
            webhook-url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') | b64encode }}"
      register: monitoring_secrets

    - name: Install kube-prometheus-stack (Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics)
      kubernetes.core.helm:
        name: monitoring
        chart_ref: kube-prometheus-stack
        chart_version: "{{ kube_prometheus_stack_chart_version }}"
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        release_namespace: "{{ monitoring_namespace }}"
        wait: true
        wait_timeout: 10m0s
        values_files:
          - "{{ playbook_dir }}/../k8s/monitoring/kube-prometheus-stack-values.yaml"
        # Jenkins runs outside the cluster: scrape it by private IP (allowed from the VPC only, terraform/security.tf)
        values:
          prometheus:
            prometheusSpec:
              additionalScrapeConfigs:
                - job_name: jenkins
                  metrics_path: /prometheus/ # Prometheus metrics plugin
                  static_configs:
                    - targets: ["{{ jenkins_private_ip }}:8080"]
                      labels: { instance: jenkins }
                - job_name: jenkins-node
                  static_configs:
                    - targets: ["{{ jenkins_private_ip }}:9100"] # ansible/roles/node_exporter
                      labels: { instance: jenkins }

    # Grafana reads the admin password only at start-up
    - name: Restart Grafana to pick up a changed admin password
      command: kubectl rollout restart deployment/monitoring-grafana -n {{ monitoring_namespace }}
      when: monitoring_secrets.changed

    - name: Apply StreamingApp alert rules
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/monitoring/alert-rules.yaml"

    # kubectl (not the k8s module) so the JSON is sent as-is: Ansible would try to template
    # Grafana's {{job}} legend placeholders in the JSON
    - name: Load Grafana dashboards (ConfigMaps found by Grafana's dashboard sidecar)
      shell: |
        set -o pipefail
        kubectl create configmap grafana-dashboard-{{ item | basename | splitext | first }}           -n {{ monitoring_namespace }} --from-file={{ item }} --dry-run=client -o yaml           | kubectl label --local -f - grafana_dashboard=1 -o yaml           | kubectl apply -f -
      args:
        executable: /bin/bash
      loop: "{{ query('fileglob', playbook_dir ~ '/../k8s/monitoring/dashboards/*.json') }}"
      register: dashboards
      changed_when: "'unchanged' not in dashboards.stdout"
